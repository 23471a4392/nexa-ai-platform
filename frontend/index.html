<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexaAI Enterprise AI Platform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><span>✦</span> NexaAI</div>
      <button class="nav active" data-page="overview">Overview</button>
      <button class="nav" data-page="chat">AI Chat</button>
      <button class="nav" data-page="documents">Documents</button>
      <button class="nav" data-page="agents">Agents</button>
      <button class="nav" data-page="prompts">Prompts</button>
      <button class="nav" data-page="analytics">Analytics</button>
      <button class="nav" data-page="api">API Keys</button>
      <button class="nav" data-page="billing">Billing</button>
      <div class="side-bottom">
        <button class="nav" data-page="settings">⚙ Settings</button>
        <div class="profile">
          <div class="avatar-circle">NS</div>
          <div>
            <div>Nagaphani Sree</div>
            <small>Administrator</small>
          </div>
        </div>
      </div>
    </aside>
    <main>
      <header>
        <div>
          <div class="eyebrow">AI PLATFORM / ENTERPRISE WORKSPACE</div>
          <h1 id="title">Overview</h1>
        </div>
        <div class="header-actions">
          <span class="status"><i></i> Systems Operational</span>
          <button class="icon" title="Search">⌕</button>
          <button class="avatar" title="Account">NS</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
